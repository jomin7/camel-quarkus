name: Manual Debezium Native Test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'
        type: string

env:
  CQ_MAVEN_ARGS: -V -ntp -e
  TESTCONTAINERS_RYUK_DISABLED: true

jobs:
  debezium-native-test:
    name: Debezium Grouped Native Test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Reclaim Disk Space
        run: |
          echo "=== Before ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          echo "=== After ==="
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Install Debezium Dependencies
        run: |
          ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -DskipTests \
            -pl integration-tests/debezium-grouped -am

      - name: Run Native Tests
        env:
          MAVEN_OPTS: -Xmx3000m
        run: |
          ./mvnw ${CQ_MAVEN_ARGS} clean verify \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
            -Dquarkus.native.builder-image.pull=missing \
            -Pnative,docker \
            --fail-at-end \
            -pl integration-tests/debezium-grouped
