name: Manual Debezium Native Test (CI group-04 simulation)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'
        type: string

env:
  CQ_MAVEN_ARGS: -V -ntp -e
  TESTCONTAINERS_RYUK_DISABLED: true

jobs:
  debezium-native-test:
    name: Native Tests - group-04 (Debezium)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Reclaim Disk Space
        run: |
          echo "=== Before ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          echo "=== After ==="
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Install Dependencies
        run: |
          ./mvnw ${CQ_MAVEN_ARGS} clean install -Dquickly -DskipTests \
            -pl integration-tests/arangodb,integration-tests/debezium-grouped,integration-tests/couchdb,integration-tests/influxdb,integration-tests/jms-qpid-amqp-client,integration-tests/jpa,integration-tests/jta,integration-tests/kudu,integration-tests/leveldb,integration-tests/mdc,integration-tests/micrometer,integration-tests/minio,integration-tests/mongodb-grouped,integration-tests/mybatis,integration-tests/observability-services,integration-tests/sjms-artemis-client \
            -am

      - name: Native Tests - group-04
        env:
          MAVEN_OPTS: -Xmx3000m
        run: |
          ./mvnw ${CQ_MAVEN_ARGS} clean verify \
            -Dformatter.skip -Dimpsort.skip -Denforcer.skip \
            -Dquarkus.native.builder-image.pull=missing \
            -Pnative,docker,ci \
            --fail-at-end \
            -pl integration-tests/arangodb,integration-tests/debezium-grouped,integration-tests/couchdb,integration-tests/influxdb,integration-tests/jms-qpid-amqp-client,integration-tests/jpa,integration-tests/jta,integration-tests/kudu,integration-tests/leveldb,integration-tests/mdc,integration-tests/micrometer,integration-tests/minio,integration-tests/mongodb-grouped,integration-tests/mybatis,integration-tests/observability-services,integration-tests/sjms-artemis-client
